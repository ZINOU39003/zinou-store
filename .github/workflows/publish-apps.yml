name: Publish app

# لوحة التحكم ترفع ملف APK إلى فرع upload/... فيتم نشره هنا تلقائياً
on:
  push:
    branches: ['upload/**']

permissions:
  contents: write

concurrency:
  group: store-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check upload
        id: chk
        run: |
          if [ -f incoming/meta.json ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; fi

      - name: Prepare
        if: steps.chk.outputs.ok == '1'
        run: |
          pip install --quiet pyaxmlparser androguard pillow
          git fetch --depth 20 origin main
          git worktree add /tmp/main origin/main

      - name: Publish
        if: steps.chk.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/process_upload.py /tmp/main

      - name: Update store list
        if: steps.chk.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store
          git commit -m "Publish $(cat /tmp/summary)"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git fetch --depth 20 origin main && git rebase origin/main
          done
          if [ -f /tmp/old_tag ]; then gh release delete "$(cat /tmp/old_tag)" -y --cleanup-tag || true; fi

      - name: Delete upload branch
        if: always() && steps.chk.outputs.ok == '1'
        run: git push origin --delete "$GITHUB_REF_NAME" || true
