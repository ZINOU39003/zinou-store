name: Build Zinou Store

on:
  push:
    branches: [main]
    paths-ignore: ['store/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/store.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/store.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - test build only, no release"
            echo "NO_KEY=1" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ZinouStore.apk

      - name: Test build (no signing key)
        if: env.NO_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ZinouStore-test
          path: ZinouStore.apk

      - name: Publish release
        if: env.NO_KEY != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-v${{ github.run_number }}
          name: Zinou Store v${{ github.run_number }}
          body: "تحميل المتجر: ZinouStore.apk"
          files: ZinouStore.apk
          make_latest: true
